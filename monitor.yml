name: Monitor Diário de Ofertas - Mogi das Cruzes

on:
  schedule:
    # 10:30 UTC = 07:30 Horário de Brasília (UTC-3)
    - cron: '30 10 * * *'
  # Permite rodar manualmente na aba Actions do GitHub para testar
  workflow_dispatch:

jobs:
  executar-monitoramento:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Instalar Chromium do Playwright e dependências do Linux
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 5. Rodar Monitor de Ofertas e Enviar no Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor_ofertas.py

      - name: 6. Salvar planilha gerada como Artefato do GitHub (Backup 7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofertas-mogi-${{ github.run_number }}
          path: ofertas_mogi_*.xlsx
          retention-days: 7
          if-no-files-found: ignore
