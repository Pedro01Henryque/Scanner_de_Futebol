name: Scanner Diário de Futebol (+EV e Tendências)

on:
  schedule:
    # 11:00 UTC = 08:00 Horário de Brasília (UTC-3)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  scanner-futebol:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Executar Scanner de Futebol e Enviar no Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scanner_futebol.py

      - name: 5. Salvar Planilha do Dia como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-futebol-${{ github.run_number }}
          path: scanner_futebol_*.xlsx
          retention-days: 7
          if-no-files-found: ignore
